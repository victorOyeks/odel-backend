spring:
  application:
    name: identity-service
  config:
    import: classpath:odel-common.yml
  datasource:
    # One Postgres database; this service owns schema "identity". "app" holds the shared audit log.
    url: jdbc:postgresql://${ODEL_DB_HOST:localhost}:${ODEL_DB_PORT:5440}/${ODEL_DB_NAME:odel}?currentSchema=identity,app
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: identity
  jpa:
    properties:
      hibernate.default_schema: identity

server:
  port: ${IDENTITY_PORT:9301}

springdoc:
  api-docs:
    path: /api-docs/identity
  swagger-ui:
    enabled: false   # one Swagger UI for every service, on the api-gateway
