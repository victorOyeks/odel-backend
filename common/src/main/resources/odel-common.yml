# Shared by every service (imported from each service's application.yml).
spring:
  datasource:
    username: ${ODEL_DB_USER:odel}
    password: ${ODEL_DB_PASSWORD:odel}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${ODEL_REDIS_HOST:localhost}
      port: ${ODEL_REDIS_PORT:6390}
      database: ${ODEL_REDIS_DATABASE:0}
      password: ${ODEL_REDIS_PASSWORD:}
  mail:
    host: ${ODEL_SMTP_HOST:smtp-relay.brevo.com}   # Brevo SMTP relay
    port: ${ODEL_SMTP_PORT:587}
    username: ${ODEL_SMTP_USER:}
    password: ${ODEL_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${ODEL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${ODEL_SMTP_STARTTLS:true}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB

server:
  # Services listen only on the loopback: the gateway is the way in, so the X-Odel-Tenant headers can be trusted.
  address: ${ODEL_SERVICE_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  health:
    mail:
      enabled: false   # email is sent by background jobs; an SMTP blip must not mark the API down
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

odel:
  console-host: ${ODEL_CONSOLE_HOST:console.${ODEL_BASE_DOMAIN:localhost}}
  internal-api-key: ${ODEL_INTERNAL_API_KEY:dev-internal-key}
  services:
    identity: ${ODEL_IDENTITY_URL:http://127.0.0.1:9301}
    tenant: ${ODEL_TENANT_URL:http://127.0.0.1:9302}
    notification: ${ODEL_NOTIFICATION_URL:http://127.0.0.1:9303}
  # Hosts: <slug>.<base-domain> and console.<base-domain>; a university's own web address also works.
  base-domain: ${ODEL_BASE_DOMAIN:localhost}
  web-scheme: ${ODEL_WEB_SCHEME:http}
  time-zone: Africa/Lagos
  session:
    idle-timeout: ${ODEL_SESSION_IDLE:PT30M}
    sign-in-timeout: PT10M       # time to finish two-step sign-in after Google
    absolute-timeout: PT12H
    secure-cookies: ${ODEL_SECURE_COOKIES:false}
    trust-device-days: 30
  mfa:
    # 32-byte AES key, base64. Production must set its own.
    encryption-key: ${ODEL_MFA_KEY:b2RlbC1kZXYtb25seS1tZmEta2V5LW5vdC1wcm9kISE=}
    issuer-suffix: ODeL
  google:
    client-id: ${ODEL_GOOGLE_CLIENT_ID:}
    client-secret: ${ODEL_GOOGLE_CLIENT_SECRET:}
    # One central callback for every university (Google needs each redirect URI registered).
    redirect-uri: ${ODEL_GOOGLE_REDIRECT_URI:http://localhost:3000/api/v1/auth/google/callback}
    dev-stub: ${ODEL_DEV_SIGN_IN:false}   # the typed-email stand-in for Google; never on production
  storage:
    mode: ${ODEL_STORAGE_MODE:s3}      # s3 (Cloudflare R2) | local (development only)
    local-dir: ${ODEL_STORAGE_LOCAL_DIR:.local-storage}
    endpoint: ${ODEL_STORAGE_ENDPOINT:http://localhost:9010}
    region: ${ODEL_STORAGE_REGION:us-east-1}
    bucket: ${ODEL_STORAGE_BUCKET:odel-docs-dev}
    access-key: ${ODEL_STORAGE_ACCESS_KEY:odel}
    secret-key: ${ODEL_STORAGE_SECRET_KEY:odel-secret}
  mail:
    mode: ${ODEL_MAIL_MODE:smtp}       # smtp | log (development only)
    from-address: ${ODEL_MAIL_FROM:no-reply@odel.dev}
    from-name: ${ODEL_MAIL_FROM_NAME:ODeL Platform}
  push:
    fcm-project-id: ${ODEL_FCM_PROJECT_ID:}
    fcm-service-account-file: ${ODEL_FCM_SERVICE_ACCOUNT_FILE:}
  jobs:
    worker-enabled: ${ODEL_WORKER_ENABLED:false}
    poll-interval: PT1S
  bootstrap:
    super-admin-email: ${ODEL_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
    super-admin-name: ${ODEL_BOOTSTRAP_SUPER_ADMIN_NAME:Platform admin}

logging:
  level:
    root: INFO
    com.odel: INFO

---
spring:
  config:
    activate:
      on-profile: dev
odel:
  google:
    dev-stub: true
  storage:
    mode: ${ODEL_STORAGE_MODE:local}
  mail:
    mode: ${ODEL_MAIL_MODE:log}
  jobs:
    worker-enabled: true
  bootstrap:
    super-admin-email: ${ODEL_BOOTSTRAP_SUPER_ADMIN_EMAIL:chuka.obi@odel.dev}
    super-admin-name: ${ODEL_BOOTSTRAP_SUPER_ADMIN_NAME:Chuka Obi}

