spring:
  application:
    name: notification-service
  config:
    import: classpath:odel-common.yml
  datasource:
    # One Postgres database; this service owns schema "notification". "app" holds the shared audit log.
    url: jdbc:postgresql://${ODEL_DB_HOST:localhost}:${ODEL_DB_PORT:5440}/${ODEL_DB_NAME:odel}?currentSchema=notification,app
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: notification
  jpa:
    properties:
      hibernate.default_schema: notification

server:
  port: ${NOTIFICATION_PORT:9303}

odel:
  mail:
    # Dev only: comma list of domains email may go to (e.g. gmail.com,oyeksglobal.com); empty = everyone (production).
    allow-domains: ${ODEL_MAIL_ALLOW_DOMAINS:}

springdoc:
  api-docs:
    path: /api-docs/notification
  swagger-ui:
    enabled: false   # one Swagger UI for every service, on the api-gateway
