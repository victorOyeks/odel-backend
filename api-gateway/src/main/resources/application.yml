server:
  port: ${GATEWAY_PORT:9300}
  # Not "framework": its X-Forwarded-For parsing answers 400 to a bare IPv6 client address (e.g. ::1).
  # The gateway needs no forwarded data itself; the access log reads X-Forwarded-For directly.
  forward-headers-strategy: none

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # No RFC 7239 "Forwarded" header naming the gateway's own peer (the web app, 127.0.0.1): services read the client
      # from X-Real-IP / X-Forwarded-For, which pass through unchanged.
      forwarded:
        enabled: false
      httpclient:
        connect-timeout: 2000
        response-timeout: 20s
      routes:
        # Paths stay /api/v1/... end to end; each service owns its prefixes. /internal/** is never routed.
        # payment-service comes first: its /api/v1/platform/payments/** sits inside tenant-service's /api/v1/platform/**.
        - id: payment-service
          uri: http://${PAYMENT_HOST:127.0.0.1}:9306
          order: -1
          predicates:
            - Path=/api/v1/payments,/api/v1/payments/**,/api/v1/fees/**,/api/v1/platform/payments/**,/api/v1/dev/payments/**,/api-docs/payment
        # Before tenant-service's /api/v1/public/**: slip verification belongs to registration-service.
        - id: registration-public
          uri: http://${REGISTRATION_HOST:127.0.0.1}:9307
          predicates:
            - Path=/api/v1/public/registration/**
        - id: identity-service
          uri: http://${IDENTITY_HOST:127.0.0.1}:9301
          predicates:
            - Path=/api/v1/auth/**,/api/v1/session,/api/v1/session/**,/api/v1/me/**,/api/v1/people,/api/v1/people/**,/api/v1/audit,/api/v1/dev/totp,/api/v1/dev/staff-codes/**,/api-docs/identity
        - id: tenant-service
          uri: http://${TENANT_HOST:127.0.0.1}:9302
          predicates:
            - Path=/api/v1/public/**,/api/v1/platform/**,/api/v1/dev/storage/**,/api/v1/dev/tenants/**,/api-docs/tenant
        - id: notification-service
          uri: http://${NOTIFICATION_HOST:127.0.0.1}:9303
          predicates:
            - Path=/api/v1/notifications,/api/v1/notifications/**,/api/v1/push-tokens,/api/v1/dev/emails,/api-docs/notification
        - id: academic-service
          uri: http://${ACADEMIC_HOST:127.0.0.1}:9304
          predicates:
            - Path=/api/v1/academic/**,/api/v1/setup/**,/api-docs/academic
        - id: student-service
          uri: http://${STUDENT_HOST:127.0.0.1}:9305
          predicates:
            - Path=/api/v1/students,/api/v1/students/**,/api/v1/imports/**,/api/v1/student-profile,/api-docs/student
        - id: registration-service
          uri: http://${REGISTRATION_HOST:127.0.0.1}:9307
          predicates:
            - Path=/api/v1/registration/**,/api/v1/dev/registration/**,/api-docs/registration

odel:
  internal-api-key: ${ODEL_INTERNAL_API_KEY:dev-internal-key}
  services:
    tenant: http://${TENANT_HOST:127.0.0.1}:9302

# One Swagger page for every service: https://<api host>/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: identity-service
        url: /api-docs/identity
      - name: tenant-service
        url: /api-docs/tenant
      - name: notification-service
        url: /api-docs/notification
      - name: academic-service
        url: /api-docs/academic
      - name: student-service
        url: /api-docs/student
      - name: payment-service
        url: /api-docs/payment
      - name: registration-service
        url: /api-docs/registration

management:
  endpoints:
    web:
      exposure:
        include: health
