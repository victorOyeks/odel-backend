spring:
  application:
    name: academic-service
  config:
    import: classpath:odel-common.yml
  datasource:
    # One Postgres database; this service owns schema "academic". "app" holds the shared audit log.
    url: jdbc:postgresql://${ODEL_DB_HOST:localhost}:${ODEL_DB_PORT:5440}/${ODEL_DB_NAME:odel}?currentSchema=academic,app
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: academic
  jpa:
    properties:
      hibernate.default_schema: academic

server:
  port: ${ACADEMIC_PORT:9304}

springdoc:
  api-docs:
    path: /api-docs/academic
  swagger-ui:
    enabled: false   # one Swagger UI for every service, on the api-gateway
