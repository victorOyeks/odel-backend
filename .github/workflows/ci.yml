name: CI
# Pull requests only: a push to develop runs the deploy workflow alone (it builds the changed services), as in hospio-backend.
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests per module; the end-to-end phase tests (e2e-tests) run against a running stack.
      - run: mvn -B verify
