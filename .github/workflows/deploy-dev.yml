name: Deploy to Dev VPS

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy: 'all' or a comma-separated list (e.g. identity-service,api-gateway)"
        required: false
        default: all

# One deploy at a time on the box; a new run waits for the running one instead of racing it.
concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A manual run, the very first push to the branch (no "before" commit), or a commit whose message
      # contains [deploy-all] deploys everything.
      - id: all
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.before == '0000000000000000000000000000000000000000' || contains(github.event.head_commit.message, '[deploy-all]') }}
        env:
          REQUESTED: ${{ github.event.inputs.services }}
        run: |
          all='["api-gateway","identity-service","tenant-service","notification-service","academic-service","student-service"]'
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ]; then
            echo "services=$all" >> "$GITHUB_OUTPUT"
          else
            echo "services=$(echo "$REQUESTED" | tr -d ' ' | awk -F, '{printf "["; for(i=1;i<=NF;i++){printf "%s\"%s\"", (i>1?",":""), $i}; printf "]"}')" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        if: ${{ steps.all.outcome == 'skipped' }}
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            api-gateway:
              - 'api-gateway/**'

            identity-service:
              - 'identity-service/**'
              - 'common/**'

            tenant-service:
              - 'tenant-service/**'
              - 'common/**'

            notification-service:
              - 'notification-service/**'
              - 'common/**'

            academic-service:
              - 'academic-service/**'
              - 'common/**'

            student-service:
              - 'student-service/**'
              - 'common/**'

      - id: pick
        run: |
          if [ -n "${{ steps.all.outputs.services }}" ]; then
            echo 'services=${{ steps.all.outputs.services }}' >> "$GITHUB_OUTPUT"
          else
            echo 'services=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build ${{ matrix.service }}
        run: mvn -B -ntp -pl ${{ matrix.service }} -am package -DskipTests

      # Ships the jar straight to the VPS over SSH; nothing needs to live in Actions artifact storage.
      - name: SCP jar to Dev VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          # Build jobs reach the box at the same moment; every remote step retries with a pause before giving up.
          remote() { for i in 1 2 3 4 5 6 7 8; do "$@" && return 0; echo "attempt $i failed, retrying in $((i*10))s"; sleep $((i*10)); done; return 1; }
          sleep $((RANDOM % 20))
          jar=$(ls ${{ matrix.service }}/target/*.jar | head -1)
          dest="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          dir="/opt/odel-dev/${{ matrix.service }}"
          remote ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$dest" "mkdir -p $dir"
          remote scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$jar" "$dest:$dir/app-new.jar.part"
          # The marker ties the staged jar to this commit, so a jar left behind by an earlier run is never deployed.
          remote ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$dest" \
            "mv $dir/app-new.jar.part $dir/app-new.jar && echo '${{ github.sha }}' > $dir/app-new.sha"
          rm -f ~/.ssh/deploy_key

  deploy:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    # Deploy whatever built, even if some matrix jobs failed; the script reports the ones that did not ship.
    if: ${{ !cancelled() && needs.detect-changes.outputs.services != '[]' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: CHANGED_SERVICES,DEPLOY_SHA
          command_timeout: 30m
          # Restart order: tenant (the gateway and identity ask it about universities) → identity → academic → student → notification → gateway.
          # Each service gets a health-checked restart with automatic rollback if it doesn't come back up.
          script: |
            set -e
            changed=$(echo "$CHANGED_SERVICES" | tr -d '[]" ' | tr ',' '\n')
            missing=""
            echo "Changed services: $(echo $changed | tr '\n' ' ')"

            declare -A health_urls
            health_urls["api-gateway"]="http://127.0.0.1:9300/actuator/health"
            health_urls["identity-service"]="http://127.0.0.1:9301/actuator/health"
            health_urls["tenant-service"]="http://127.0.0.1:9302/actuator/health"
            health_urls["notification-service"]="http://127.0.0.1:9303/actuator/health"
            health_urls["academic-service"]="http://127.0.0.1:9304/actuator/health"
            health_urls["student-service"]="http://127.0.0.1:9305/actuator/health"

            ordered=(
              tenant-service
              identity-service
              academic-service
              student-service
              notification-service
              api-gateway
            )

            for svc in "${ordered[@]}"; do
              if ! echo "$changed" | grep -qx "$svc"; then
                echo "  — $svc unchanged, skipping"
                continue
              fi
              staged_sha=$(cat "/opt/odel-dev/$svc/app-new.sha" 2>/dev/null || echo none)
              if [ ! -f "/opt/odel-dev/$svc/app-new.jar" ] || [ "$staged_sha" != "$DEPLOY_SHA" ]; then
                if [ "$(cat "/opt/odel-dev/$svc/app.sha" 2>/dev/null)" = "$DEPLOY_SHA" ]; then
                  # A rerun of failed jobs: this service already shipped from this commit on an earlier attempt.
                  echo "  — $svc already running this commit, skipping"
                  rm -f "/opt/odel-dev/$svc/app-new.jar" "/opt/odel-dev/$svc/app-new.sha"
                  continue
                fi
                echo "  ✗ No JAR from this commit for $svc (staged: $staged_sha; its build job failed?) — leaving it as it is"
                rm -f "/opt/odel-dev/$svc/app-new.jar" "/opt/odel-dev/$svc/app-new.sha"
                missing="$missing $svc"
                continue
              fi
              rm -f "/opt/odel-dev/$svc/app-new.sha"
              echo "→ Deploying $svc"
              [ -f /opt/odel-dev/$svc/app.jar ] && cp /opt/odel-dev/$svc/app.jar /opt/odel-dev/$svc/app.jar.bak
              mv /opt/odel-dev/$svc/app-new.jar /opt/odel-dev/$svc/app.jar
              echo "$DEPLOY_SHA" > /opt/odel-dev/$svc/app.sha
              sudo systemctl enable -q odel-$svc
              sudo systemctl restart odel-$svc
              ok=false
              for i in $(seq 1 60); do
                status=$(wget -qO- "${health_urls[$svc]}" 2>/dev/null | grep -o '"status":"UP"' || echo "")
                if [ -n "$status" ]; then
                  echo "  ✓ $svc healthy"
                  ok=true
                  break
                fi
                sleep 5
              done
              if [ "$ok" = "false" ]; then
                echo "  ✗ $svc did not become healthy in 300s — rolling back"
                [ -f /opt/odel-dev/$svc/app.jar.bak ] && cp /opt/odel-dev/$svc/app.jar.bak /opt/odel-dev/$svc/app.jar
                sudo systemctl restart odel-$svc
                exit 1
              fi
              rm -f /opt/odel-dev/$svc/app.jar.bak
            done
            if [ -n "$missing" ]; then
              echo "✗ Deployed everything that built, but these did not ship:$missing"
              exit 1
            fi
            echo "✓ Dev deployment complete"
